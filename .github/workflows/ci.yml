name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: extractors/ Cognee-isolation guard (AGENTS.md 核心红线③)
        run: ./scripts/check_extractors_isolation.sh

      - name: cognee.config usage guard (AGENTS.md 核心红线④)
        run: ./scripts/check_cognee_config.sh

      - name: cognee.graph API guard (AGENTS.md 核心红线①)
        run: ./scripts/check_cognee_graph_api.sh

      - name: README CLI reference sync check
        run: uv run python scripts/gen_cli_docs.py --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env:
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      COGNEE_SKIP_CONNECTION_TEST: "true"
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Unit tests
        run: >-
          uv run python -m pytest tests/unit/ -v
          --junitxml=test-results-unit.xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-py${{ matrix.python-version }}
          path: test-results-unit.xml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    env:
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      COGNEE_SKIP_CONNECTION_TEST: "true"
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Show key env vars
        run: |
          echo "ENABLE_BACKEND_ACCESS_CONTROL=$ENABLE_BACKEND_ACCESS_CONTROL"
          echo "COGNEE_SKIP_CONNECTION_TEST=$COGNEE_SKIP_CONNECTION_TEST"
          echo "HF_HUB_OFFLINE=$HF_HUB_OFFLINE"

      - name: Integration tests
        run: >-
          uv run python -m pytest tests/integration/ -v
          --junitxml=test-results-integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: test-results-integration.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    env:
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      COGNEE_SKIP_CONNECTION_TEST: "true"
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Show key env vars
        run: |
          echo "ENABLE_BACKEND_ACCESS_CONTROL=$ENABLE_BACKEND_ACCESS_CONTROL"
          echo "COGNEE_SKIP_CONNECTION_TEST=$COGNEE_SKIP_CONNECTION_TEST"
          echo "HF_HUB_OFFLINE=$HF_HUB_OFFLINE"

      - name: E2E tests
        run: >-
          uv run python -m pytest tests/e2e/ -v
          --junitxml=test-results-e2e.xml

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: test-results-e2e.xml

      # 真实 install.sh 成功安装路径（bats/e2e 全 mock 外部命令，主路径
      # 从未被自动化验证）。uv sync 在 CI 内网可控；install.sh 幂等刷新
      # 已存在的 .venv（无 --dev，但 e2e 测试已跑完）。
      - name: install.sh real path (uv sync + CLI verify)
        run: ./install.sh

      - name: Verify deep-obsidian CLI after real install
        run: ./.venv/bin/deep-obsidian --version

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck install.sh
        run: shellcheck install.sh

      - name: Install bats-core
        run: |
          git clone --depth 1 \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: bats tests (install.sh branching)
        run: bats tests/bats/

  compatibility:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      COGNEE_SKIP_CONNECTION_TEST: "true"
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache: true
      - run: uv python install 3.13
      - run: uv sync --dev
      - run: uv pip install --upgrade "cognee>=1.4,<2.0"
      - run: >-
          uv run python -m pytest tests/ -v
          --junitxml=test-results-compat.xml

      - name: Upload compatibility test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-compatibility
          path: test-results-compat.xml

  test-report:
    # junit 结果汇总到 PR check（dorny/test-reporter）——失败定位不再需要
    # 手动下载 artifact。compatibility 只在 schedule 跑，skipped job 在
    # needs 里视为 success，PR 时不受影响。
    if: always()
    runs-on: ubuntu-latest
    needs: [test, integration, e2e, compatibility]
    permissions:
      checks: write
      contents: read

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results

      - name: Publish test report to PR check
        uses: dorny/test-reporter@v1
        with:
          name: test-summary
          path: test-results/**/*.xml
          reporter: github-pr-check
